name: Deploy docs and Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # Storybook. Rebuilds the tokens first, so a token change can never ship
      # alongside a stale foundation page.
      - run: npm ci
      - run: npm run build

      # Docs site. Imports the same component source and the same generated
      # tokens, so there is nothing to keep in sync by hand.
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs

      # Docs at the root, Storybook one level in.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r docs/dist/. site/
          cp -r storybook-static site/storybook
          test -f site/index.html
          test -f site/storybook/index.html
          echo "pages: $(find site -name 'index.html' | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
