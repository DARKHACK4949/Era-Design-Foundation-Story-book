name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: 'Regenerate baselines and commit them'
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    # The same container every time. Font rasterisation differs between
    # machines, so baselines made anywhere else fail for reasons that have
    # nothing to do with the design system.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses to touch it until the path is marked safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the tokens first, so a screenshot can never be taken against a
      # stale token file.
      - run: npm run build

      - name: Look for baselines
        id: baselines
        run: |
          if [ -n "$(ls -A tests/__screenshots__ 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No baselines committed yet. Run this workflow manually with 'Regenerate baselines' ticked to create them."
          fi

      - name: Compare against baselines
        if: ${{ !inputs.update && steps.baselines.outputs.present == 'true' }}
        run: npx playwright test

      - name: Regenerate baselines
        if: ${{ inputs.update }}
        run: npx playwright test --update-snapshots

      # Uploaded whether or not the push below works, so the baselines are
      # never stranded inside a failed run.
      - name: Upload baselines
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/__screenshots__/
          retention-days: 14

      - name: Commit regenerated baselines
        if: ${{ inputs.update }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update visual regression baselines"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Could not push the baselines. In Settings > Actions > General, set Workflow permissions to 'Read and write permissions', then run this workflow again. The baselines are attached to this run as the visual-baselines artifact in the meantime."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.update }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
